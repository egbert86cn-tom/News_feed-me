name: Build site

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0 点运行，可根据需要修改
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v2.1.4
      - uses: actions/setup-node@v2.1.4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install -D @tianheg/osmosfeed@1.18.1
      - name: Build the feed
        run: npm run build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public